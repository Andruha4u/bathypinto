# Netlify configuration — static site, no build step.

[build]
  publish = "."
  command = ""

# ---- Security headers (applied to every response) ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Everything is self-hosted, so the policy can be strict.
    # 'unsafe-inline' covers the pre-paint theme script in <head>.
    # If you add analytics, widen script-src and connect-src here.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# ---- Caching ----
# HTML must revalidate so edits go live immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images are content-stable; a year is safe because you rename on change.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS and JS are edited by hand without content hashes, so keep this short.
# If you later add hashed filenames (site.a1b2c3.css), raise it to a year.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ---- Redirects ----
# Force the apex/custom domain to one canonical host once a domain is attached.
# Uncomment and set your domain to avoid duplicate-content indexing.
# [[redirects]]
#   from = "https://bathypinto.netlify.app/*"
#   to = "https://yourdomain.com/:splat"
#   status = 301
#   force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
